<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>dr.confluence — terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --green:#00ff41;
    --green-dim:#0aa62f;
    --green-faint:#063d16;
    --bg:#0a0d0a;
    --panel:#0d130d;
    --border:#154518;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:'JetBrains Mono', monospace;
    color:var(--green);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }

  canvas#rain{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    opacity:0.35;
  }

  .terminal{
    position:relative;
    z-index:1;
    width:100%;
    max-width:760px;
    background:rgba(10,15,10,0.92);
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:0 0 40px rgba(0,255,65,0.08), 0 20px 60px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:#0f150f;
    border-bottom:1px solid var(--border);
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#ff5f57;}
  .dot.y{background:#febc2e;}
  .dot.g{background:#28c840;}
  .titlebar .path{
    margin-left:auto;
    margin-right:auto;
    font-size:12px;
    color:var(--green-dim);
    letter-spacing:0.5px;
  }

  .screen{
    padding:22px 24px 26px;
    max-height:72vh;
    overflow-y:auto;
  }
  .screen::-webkit-scrollbar{width:8px;}
  .screen::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .screen::-webkit-scrollbar-track{background:transparent;}

  .prompt{
    font-size:13px;
    color:var(--green-dim);
    margin-bottom:2px;
  }
  .prompt .user{color:var(--green);}

  #typed-line{
    font-size:14px;
    margin:0 0 4px;
    white-space:pre-wrap;
  }
  .cursor{
    display:inline-block;
    width:8px;
    height:15px;
    background:var(--green);
    vertical-align:-2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .hint{
    font-size:11px;
    color:var(--green-dim);
    margin:2px 0 18px;
    opacity:0;
    transition:opacity 0.4s ease 1.6s;
  }
  .hint.show{opacity:0.8;}

  .toc{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid var(--border);
  }
  .toc-item{
    border-bottom:1px solid var(--border);
  }
  .toc-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 4px;
    cursor:pointer;
    font-size:13.5px;
    user-select:none;
    transition:background 0.15s ease, padding-left 0.15s ease;
  }
  .toc-header:hover{
    background:rgba(0,255,65,0.05);
    padding-left:10px;
  }
  .toc-header .caret{
    display:inline-block;
    width:12px;
    color:var(--green-dim);
    transition:transform 0.25s ease;
    font-size:11px;
  }
  .toc-item.open .toc-header .caret{
    transform:rotate(90deg);
    color:var(--green);
  }
  .toc-header .idx{
    color:var(--green-dim);
    font-size:12px;
    min-width:18px;
  }
  .toc-header .fname{
    color:var(--green);
  }
  .toc-header .fname::after{
    content:attr(data-ext);
    color:var(--green-dim);
  }
  .toc-item.open .toc-header{
    background:rgba(0,255,65,0.06);
  }

  .toc-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
  }
  .toc-item.open .toc-body{
    max-height:600px;
  }
  .toc-body-inner{
    padding:4px 4px 18px 26px;
    font-size:12.5px;
    line-height:1.7;
    color:#8fe6a3;
    border-left:1px dashed var(--border);
    margin-left:9px;
  }
  .toc-body-inner p{margin:0 0 10px;}
  .toc-body-inner .badge{
    display:inline-block;
    font-size:10.5px;
    padding:2px 7px;
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--green);
    margin:2px 6px 2px 0;
  }
  .toc-body-inner table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }
  .toc-body-inner td{
    padding:5px 6px;
    border-bottom:1px solid var(--border);
    font-size:12px;
  }
  .toc-body-inner td.status{color:var(--green); white-space:nowrap;}

  .footer-line{
    margin-top:18px;
    font-size:11px;
    color:var(--green-dim);
  }
  .footer-line .ok{color:var(--green);}
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="terminal">
  <div class="titlebar">
    <span class="dot r"></span>
    <span class="dot y"></span>
    <span class="dot g"></span>
    <span class="path">rohit@confluence: ~</span>
  </div>

  <div class="screen">
    <div class="prompt"><span class="user">rohit@confluence</span>:~$</div>
    <p id="typed-line"><span class="cursor"></span></p>
    <p class="hint" id="hint">click a line below to expand it</p>

    <ul class="toc" id="toc"></ul>

    <p class="footer-line">process running · <span class="ok">exit code pending</span></p>
  </div>
</div>

<script>
(function(){
  var canvas=document.getElementById('rain');
  var ctx=canvas.getContext('2d');
  var W,H,cols,drops;
  var chars='01アイウエオカキクケコサシスセソ$#@+-*/<>';
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    cols=Math.floor(W/16);
    drops=new Array(cols).fill(0);
  }
  window.addEventListener('resize',resize);
  resize();
  function draw(){
    ctx.fillStyle='rgba(10,13,10,0.08)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00ff41';
    ctx.font='14px monospace';
    for(var i=0;i<drops.length;i++){
      var text=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(text, i*16, drops[i]*16);
      if(drops[i]*16>H && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

(function(){
  var line="cat table_of_contents.md";
  var el=document.getElementById('typed-line');
  var cursor=el.querySelector('.cursor');
  var i=0;
  function type(){
    if(i<=line.length){
      el.textContent=line.slice(0,i);
      el.appendChild(cursor);
      i++;
      setTimeout(type, 45);
    } else {
      document.getElementById('hint').classList.add('show');
    }
  }
  type();
})();

var sections=[
  {
    ext:'.md', name:'01_whoami', body:
      '<p>I build engineering systems that combine networking, operating systems, detection engineering, automation, and AI. Every repository is part of a larger ecosystem focused on practical, documented, open-source software.</p>'
  },
  {
    ext:'.log', name:'02_stack', body:
      '<span class="badge">python</span><span class="badge">rust</span><span class="badge">linux</span><span class="badge">docker</span><span class="badge">git</span><span class="badge">wireshark</span>'
  },
  {
    ext:'/', name:'03_featured-systems', body:
      '<table>'+
      '<tr><td>NDAP — network detection & analysis platform</td><td class="status">active</td></tr>'+
      '<tr><td>packet-sniffer-analyzer — packet inspection</td><td class="status">active</td></tr>'+
      '<tr><td>mini-scanner — concurrent TCP scanning</td><td class="status">stable</td></tr>'+
      '<tr><td>log-analyzer — log-based attack detection</td><td class="status">stable</td></tr>'+
      '<tr><td>sovereign — local multi-agent AI platform</td><td class="status">active</td></tr>'+
      '</table>'
  },
  {
    ext:'.txt', name:'04_engineering-areas', body:
      '<p>[x] systems programming<br>[x] linux &amp; networking<br>[x] detection engineering<br>[x] python &amp; rust<br>[x] open source<br>[x] AI systems<br>[x] research &amp; documentation</p>'
  },
  {
    ext:'.md', name:'05_mission', body:
      '<p>Build a modular ecosystem of open-source engineering projects that share reusable architecture, documentation, and tooling.</p>'
  },
  {
    ext:'.md', name:'06_roadmap', body:
      '<p><b>near</b> — finish NDAP core · improve packet sniffer analyzer · expand rust networking · publish docs<br>'+
      '<b>mid</b> — shared libraries · detection rules · CI/CD · docker images<br>'+
      '<b>long</b> — knowledge base · research publications · unified docs portal</p>'
  },
  {
    ext:'.sh', name:'07_connect', body:
      '<p>github.com/Rohit30Confluence<br>linkedin.com/in/rohitdinde</p>'
  }
];

var tocEl=document.getElementById('toc');
sections.forEach(function(s, idx){
  var li=document.createElement('li');
  li.className='toc-item';
  var num=String(idx+1).padStart(2,'0');
  li.innerHTML=
    '<div class="toc-header">'+
      '<span class="caret">&#9656;</span>'+
      '<span class="idx">'+num+'</span>'+
      '<span class="fname" data-ext="'+s.ext+'">'+s.name+'</span>'+
    '</div>'+
    '<div class="toc-body"><div class="toc-body-inner">'+s.body+'</div></div>';
  var header=li.querySelector('.toc-header');
  header.addEventListener('click', function(){
    var wasOpen=li.classList.contains('open');
    document.querySelectorAll('.toc-item.open').forEach(function(o){o.classList.remove('open');});
    if(!wasOpen) li.classList.add('open');
  });
  tocEl.appendChild(li);
});
</script>

</body>
</html>
