<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>

    <linearGradient id="accent"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>

    </linearGradient>

    <filter id="glow">

      <feGaussianBlur stdDeviation="4" result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>

  <!-- Background -->

  <rect
      x="16"
      y="16"
      width="480"
      height="480"
      rx="32"
      fill="#0D1117"
      stroke="#30363D"
      stroke-width="2"/>

  <!-- Connections -->

  <g stroke="#8B949E"
     stroke-width="6"
     stroke-linecap="round">

      <line x1="256" y1="128" x2="256" y2="256"/>

      <line x1="256" y1="256" x2="256" y2="384"/>

      <line x1="128" y1="256" x2="256" y2="256"/>

      <line x1="256" y1="256" x2="384" y2="256"/>

      <line x1="170" y1="170" x2="256" y2="256"/>

      <line x1="342" y1="170" x2="256" y2="256"/>

      <line x1="170" y1="342" x2="256" y2="256"/>

      <line x1="342" y1="342" x2="256" y2="256"/>

  </g>

  <!-- Outer Nodes -->

  <g fill="#58A6FF">

      <circle cx="256" cy="128" r="18"/>

      <circle cx="256" cy="384" r="18"/>

      <circle cx="128" cy="256" r="18"/>

      <circle cx="384" cy="256" r="18"/>

      <circle cx="170" cy="170" r="16"/>

      <circle cx="342" cy="170" r="16"/>

      <circle cx="170" cy="342" r="16"/>

      <circle cx="342" cy="342" r="16"/>

  </g>

  <!-- Center -->

  <circle
      cx="256"
      cy="256"
      r="34"
      fill="url(#accent)"
      filter="url(#glow)"/>

  <circle
      cx="256"
      cy="256"
      r="10"
      fill="#F0F6FC"/>

</svg>
