<svg xmlns="http://www.w3.org/2000/svg"
     width="960"
     height="540"
     viewBox="0 0 960 540">

  <defs>
    <linearGradient id="accent"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="8"
                    stdDeviation="12"
                    flood-color="#000000"
                    flood-opacity="0.35"/>
    </filter>

    <style>
      .title{
        font:700 34px Arial,sans-serif;
        fill:#F0F6FC;
      }

      .section{
        font:600 15px Arial,sans-serif;
        fill:#58A6FF;
        letter-spacing:1px;
      }

      .text{
        font:400 17px Arial,sans-serif;
        fill:#F0F6FC;
      }

      .muted{
        font:400 15px Arial,sans-serif;
        fill:#8B949E;
      }

      .status{
        font:600 14px Arial,sans-serif;
        fill:#3FB950;
      }
    </style>
  </defs>

  <!-- Card -->

  <rect
      x="20"
      y="20"
      width="920"
      height="500"
      rx="20"
      fill="#0D1117"
      stroke="#30363D"
      stroke-width="2"
      filter="url(#shadow)"/>

  <!-- Header -->

  <circle
      cx="65"
      cy="70"
      r="8"
      fill="#3FB950"/>

  <text
      x="85"
      y="77"
      class="status">
      ACTIVE DEVELOPMENT
  </text>

  <text
      x="60"
      y="145"
      class="title">
      PROJECT NAME
  </text>

  <text
      x="60"
      y="180"
      class="muted">
      Short one-line description of the repository.
  </text>

  <!-- Divider -->

  <line
      x1="60"
      y1="215"
      x2="900"
      y2="215"
      stroke="#30363D"/>

  <!-- Category -->

  <text
      x="60"
      y="255"
      class="section">
      CATEGORY
  </text>

  <text
      x="60"
      y="285"
      class="text">
      Detection Engineering
  </text>

  <!-- Mission -->

  <text
      x="60"
      y="335"
      class="section">
      MISSION
  </text>

  <text
      x="60"
      y="365"
      class="text">
      Build modular, reusable engineering software
  </text>

  <text
      x="60"
      y="392"
      class="text">
      for networking, automation and security.
  </text>

  <!-- Stack -->

  <text
      x="520"
      y="255"
      class="section">
      STACK
  </text>

  <rect x="520" y="275" width="80" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>
  <text x="540" y="295" class="muted">Python</text>

  <rect x="610" y="275" width="70" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>
  <text x="630" y="295" class="muted">Rust</text>

  <rect x="690" y="275" width="95" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>
  <text x="708" y="295" class="muted">Docker</text>

  <!-- Progress -->

  <text
      x="520"
      y="345"
      class="section">
      PROGRESS
  </text>

  <rect
      x="520"
      y="365"
      width="320"
      height="12"
      rx="6"
      fill="#21262D"/>

  <rect
      x="520"
      y="365"
      width="210"
      height="12"
      rx="6"
      fill="url(#accent)"/>

  <text
      x="850"
      y="376"
      class="muted">
      65%
  </text>

  <!-- Footer -->

  <line
      x1="60"
      y1="455"
      x2="900"
      y2="455"
      stroke="#30363D"/>

  <text
      x="60"
      y="490"
      class="muted">
      Repository →
  </text>

  <text
      x="230"
      y="490"
      class="muted">
      Documentation →
  </text>

  <text
      x="780"
      y="490"
      class="muted">
      dr.confluence
  </text>

</svg>
