<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="800"
     viewBox="0 0 1400 800">

  <defs>

    <style>
      .title{
        font:700 34px Arial,sans-serif;
        fill:#F0F6FC;
      }

      .subtitle{
        font:500 18px Arial,sans-serif;
        fill:#8B949E;
      }

      .heading{
        font:600 18px Arial,sans-serif;
        fill:#58A6FF;
      }

      .text{
        font:400 16px Arial,sans-serif;
        fill:#F0F6FC;
      }

      .small{
        font:400 14px Arial,sans-serif;
        fill:#8B949E;
      }

      .box{
        fill:#161B22;
        stroke:#30363D;
        stroke-width:2;
      }

      .arrow{
        stroke:#58A6FF;
        stroke-width:3;
        fill:none;
        marker-end:url(#arrowhead);
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto">

      <polygon points="0 0, 10 3.5, 0 7"
               fill="#58A6FF"/>

    </marker>

  </defs>

  <!-- Background -->

  <rect width="1400"
        height="800"
        fill="#0D1117"/>

  <!-- Title -->

  <text x="60"
        y="70"
        class="title">

      NDAP

  </text>

  <text x="60"
        y="105"
        class="subtitle">

      Network Detection & Analysis Platform Architecture

  </text>

  <!-- Input -->

  <rect class="box"
        x="60"
        y="180"
        width="220"
        height="120"
        rx="16"/>

  <text x="90"
        y="220"
        class="heading">

      INPUT

  </text>

  <text x="90"
        y="255"
        class="text">

      PCAP Files

  </text>

  <text x="90"
        y="280"
        class="text">

      Live Capture

  </text>

  <!-- Capture -->

  <rect class="box"
        x="370"
        y="180"
        width="220"
        height="120"
        rx="16"/>

  <text x="400"
        y="220"
        class="heading">

      CAPTURE ENGINE

  </text>

  <text x="400"
        y="255"
        class="text">

      Packet Reader

  </text>

  <text x="400"
        y="280"
        class="text">

      Stream Builder

  </text>

  <!-- Parser -->

  <rect class="box"
        x="680"
        y="180"
        width="220"
        height="120"
        rx="16"/>

  <text x="710"
        y="220"
        class="heading">

      PARSER

  </text>

  <text x="710"
        y="255"
        class="text">

      Ethernet

  </text>

  <text x="710"
        y="280"
        class="text">

      IPv4 / IPv6

  </text>

  <!-- Detection -->

  <rect class="box"
        x="990"
        y="180"
        width="280"
        height="120"
        rx="16"/>

  <text x="1020"
        y="220"
        class="heading">

      DETECTION ENGINE

  </text>

  <text x="1020"
        y="255"
        class="text">

      Rules

  </text>

  <text x="1020"
        y="280"
        class="text">

      Threat Logic

  </text>

  <!-- Output -->

  <rect class="box"
        x="520"
        y="470"
        width="360"
        height="170"
        rx="18"/>

  <text x="560"
        y="515"
        class="heading">

      OUTPUT

  </text>

  <text x="560"
        y="555"
        class="text">

      JSON Reports

  </text>

  <text x="560"
        y="585"
        class="text">

      Console Output

  </text>

  <text x="560"
        y="615"
        class="text">

      Threat Summary

  </text>

  <!-- Horizontal Flow -->

  <line class="arrow"
        x1="280"
        y1="240"
        x2="370"
        y2="240"/>

  <line class="arrow"
        x1="590"
        y1="240"
        x2="680"
        y2="240"/>

  <line class="arrow"
        x1="900"
        y1="240"
        x2="990"
        y2="240"/>

  <!-- Down Arrow -->

  <line class="arrow"
        x1="1130"
        y1="300"
        x2="700"
        y2="470"/>

  <!-- Footer -->

  <line x1="60"
        y1="730"
        x2="1340"
        y2="730"
        stroke="#30363D"/>

  <text x="60"
        y="760"
        class="small">

      dr.confluence • NDAP Architecture • v1.0

  </text>

</svg>
